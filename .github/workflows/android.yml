name: Android AAB Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Check environment
        run: |
          java -version
          gradle --version
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la

      - name: Build Release AAB (without signing)
        run: gradle :app:bundleRelease --no-daemon -x signReleaseBundle

      - name: Find AAB
        run: |
          echo "AAB files:"
          find . -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
